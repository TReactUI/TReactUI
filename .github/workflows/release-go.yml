name: Release Go module

# The Go adapter (packages/tty-go) is a module of its own, versioned by git tags named
# packages/tty-go/vX.Y.Z. `nx release` does not tag Go modules, so this does, once CI has passed on main.
# It is a separate file because ci.yml is generated by mnci.
#
# The tag is decided from the conventional commits that touched packages/tty-go since its last tag: a feat or
# a fix bumps the patch while the major version is 0, anything else (docs, chore, test...) releases nothing.
# See tools/go-release. The Go proxy and pkg.go.dev pick a tag up on their own.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Tags are created one at a time, from the tags that exist when a run starts.
concurrency:
  group: release-go
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    # Only for a push to main that passed CI (not for a pull request, not for a failed run).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      # The commit CI verified, not whatever main has moved to since, with every tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - run: git fetch --tags --force
        name: Fetch every tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node --test "tools/go-release/*.spec.mjs"
        name: Test the release logic

      - run: node tools/go-release/release-go-module.handler.mjs --module packages/tty-go
        name: Tag packages/tty-go if its commits call for a release
